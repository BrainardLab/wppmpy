[project]
name = "wppmpy-aepsych"
version = "0.1.0"
requires-python = ">=3.12"
description = "AEPsych experiment environment for wppmpy"

# aepsych 0.7.3 pins numpy<2.0, which is incompatible with JAX 0.5+.
# We therefore pin JAX to the latest 0.4.x release, which supports numpy 1.x.
# ellipsoids-elife2025 is installed from the eLife2025 repo so that dconfig,
# analysis, and other modules can be imported without sys.path hacks.
dependencies = [
    "ellipsoids-elife2025 @ git+https://github.com/fh862/ellipsoids_public.git@dev#subdirectory=ellipsoids",
    "aepsych==0.7.3",
    "jax<0.5",
    "jaxlib",
    "plotly",
    "imageio",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aepsych_dconfig*"]
