repos:
-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    -   id: nbstripout
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
    -   id: ruff
        args:
        - --fix
    -   id: ruff-format
-   repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
    -   id: nbqa-mypy
        additional_dependencies: [mypy==1.19.1]
-   repo: local
    hooks:
    -   id: check-machine-config-sync
        name: machine_config.py in sync with wppmpy_private
        language: system
        entry: python3 .hooks/check_machine_config_sync.py
        files: aepsych/aepsych_dconfig/machine_config\.py
        pass_filenames: false
    -   id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
    -   id: mypy
        pass_filenames: false
        args:
        - --exclude
        - (^|/)(\.venv|venv)(/|$)
        - .
        files: \.py$
